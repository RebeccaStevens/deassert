name: Test

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test_js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/prepare
      - run: pnpm run test
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
